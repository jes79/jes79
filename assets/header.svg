<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="0.55" stop-color="#151033"/>
      <stop offset="1" stop-color="#2a0f3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset="0.5" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7cf3ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .ring { transform-origin: 960px 160px; }
      .r1 { animation: spin 40s linear infinite; }
      .r2 { animation: spin 26s linear infinite reverse; }
      .r3 { animation: spin 60s linear infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 960px 160px; }
      .spark { animation: rise 6s linear infinite; }
      .s2 { animation-delay: -1.5s; } .s3 { animation-delay: -3s; } .s4 { animation-delay: -4.5s; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation: fade 1.2s 0.3s ease-out both; }
      .fade3 { animation: fade 1.2s 0.6s ease-out both; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-260px); opacity: 0; } }
      @keyframes scan { 0%,100% { transform: translateX(-200px); opacity: 0; } 50% { opacity: .5; } 99% { transform: translateX(1300px); } }
      @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="120" height="320" fill="#7cf3ff" opacity="0.08" filter="url(#soft)"/>

  <!-- magic circle -->
  <circle cx="960" cy="160" r="150" fill="url(#glow)" class="pulse"/>
  <g class="ring r3" fill="none" stroke="#b98cff" stroke-opacity="0.35">
    <circle cx="960" cy="160" r="128" stroke-dasharray="2 10" stroke-width="2"/>
  </g>
  <g class="ring r1" fill="none" stroke="#7cf3ff" stroke-opacity="0.7" stroke-width="1.5">
    <circle cx="960" cy="160" r="108"/>
    <circle cx="960" cy="160" r="96" stroke-dasharray="14 6 3 6"/>
    <polygon points="960,64 1043,208 877,208"/>
    <polygon points="960,256 877,112 1043,112"/>
  </g>
  <g class="ring r2" fill="none" stroke="#ff7ad9" stroke-opacity="0.75" stroke-width="1.5">
    <circle cx="960" cy="160" r="62"/>
    <rect x="916" y="116" width="88" height="88" transform="rotate(45 960 160)"/>
    <rect x="916" y="116" width="88" height="88"/>
  </g>
  <g class="ring r1" fill="#7cf3ff" fill-opacity="0.9">
    <circle cx="960" cy="52" r="4"/><circle cx="1068" cy="160" r="4"/>
    <circle cx="960" cy="268" r="4"/><circle cx="852" cy="160" r="4"/>
  </g>
  <text x="960" y="172" text-anchor="middle" class="mono pulse" font-size="34" font-weight="700" fill="#ffffff">{ }</text>

  <!-- sparks -->
  <g fill="#b98cff">
    <circle class="spark" cx="820" cy="300" r="2"/>
    <circle class="spark s2" cx="1100" cy="310" r="2.5" fill="#7cf3ff"/>
    <circle class="spark s3" cx="900" cy="315" r="1.8" fill="#ff7ad9"/>
    <circle class="spark s4" cx="1040" cy="305" r="2"/>
    <circle class="spark s3" cx="1150" cy="300" r="1.6"/>
    <circle class="spark s2" cx="760" cy="312" r="1.6" fill="#7cf3ff"/>
  </g>

  <!-- text -->
  <g class="fade">
    <text x="70" y="96" class="mono" font-size="18" fill="#7cf3ff" letter-spacing="3">&gt; HELLO, WORLD_</text>
  </g>
  <g class="fade2">
    <text x="66" y="178" font-size="86" font-weight="800" fill="url(#title)" letter-spacing="2">jes79</text>
  </g>
  <g class="fade3">
    <text x="70" y="222" font-size="24" font-weight="600" fill="#e8e6ff">Unity Environment · Technical Art · AI-assisted Workflow</text>
    <text x="70" y="258" class="mono" font-size="15" fill="#a9a3d6">Game Dev Instructor  //  Shaders  //  UI Effects  //  Pipelines</text>
  </g>
</svg>
